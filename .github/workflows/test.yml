name: Tests

# Runs on every pull request into main, so a regression is caught before it
# can be merged and auto-deployed. Also runs on pushes to main, which covers
# the commits the Drive publisher makes directly through the GitHub API —
# those never open a pull request.
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      - name: Check for regressions
        run: npm test
