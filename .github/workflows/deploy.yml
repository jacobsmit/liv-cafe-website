name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time. The Drive publisher writes each file as its
# own commit, so updating a special event pushes twice within a second and
# starts two runs — which then race for the same Pages environment. That is
# what wedged the deploy for f63fb03: the second run inherited a CDN purge it
# could never finish, timed out twice, and left the site half-updated.
#
# cancel-in-progress stays false so a deployment already running is allowed to
# finish rather than being killed part-way. A run queued behind it waits, and
# if a newer one arrives while waiting, the older queued run is dropped — the
# most recent content is the one that ships, which is what we want.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install, build, and upload your site
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4